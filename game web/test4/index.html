<style>

function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG=mulberry32(20260207);
function lerpColor(c1,c2,t){const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);
  const r=Math.round(lerp(a>>16,b>>16,t)),g=Math.round(lerp((a>>8)&255,(b>>8)&255,t)),bl=Math.round(lerp(a&255,b&255,t));

/* ============ AUDIO (Web Audio API, zéro fichier) ============ */
const AU={ctx:null,master:null,sfx:null,amb:null,noiseBuf:null,vol:{master:.8,rain:.65,sfx:.9},
init(){ if(this.ctx){ if(this.ctx.state==='suspended')this.ctx.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  this.ctx=new C();
  this.master=this.ctx.createGain(); this.master.connect(this.ctx.destination);
  this.sfx=this.ctx.createGain(); this.sfx.connect(this.master);
  this.amb=this.ctx.createGain(); this.amb.connect(this.master);
  const b=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  this.noiseBuf=b; this.startRain(); this.applyVol(); },
startRain(){ if(!this.ctx)return;
  const s1=this.ctx.createBufferSource(); s1.buffer=this.noiseBuf; s1.loop=true;
  const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=950; bp.Q.value=.45;
  const g1=this.ctx.createGain(); g1.gain.value=.5;
  s1.connect(bp); bp.connect(g1); g1.connect(this.amb);
  const s2=this.ctx.createBufferSource(); s2.buffer=this.noiseBuf; s2.loop=true;
  const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=360;
  const g2=this.ctx.createGain(); g2.gain.value=.3;
  s2.connect(lp); lp.connect(g2); g2.connect(this.amb);
  s1.start(); s2.start(); },
applyVol(){ if(!this.ctx)return;
  this.master.gain.value=this.vol.master;
  this.amb.gain.value=this.vol.rain*.55;
  this.sfx.gain.value=this.vol.sfx; },
env(g,t0,a,pk,dec){ g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(pk,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+a+dec); },
tone(type,f0,f1,dur,pk,del=0){ if(!this.ctx)return; const t0=this.ctx.currentTime+del;
  const o=this.ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(Math.max(20,f0),t0);
  if(f1&&f1>0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  const g=this.ctx.createGain(); this.env(g,t0,.008,pk,dur);
  o.connect(g); g.connect(this.sfx); o.start(t0); o.stop(t0+dur+.15); },
noise(dur,freq,pk,type='lowpass',del=0,q=1){ if(!this.ctx)return; const t0=this.ctx.currentTime+del;
  const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf;
  const f=this.ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=this.ctx.createGain(); this.env(g,t0,.01,pk,dur);

const WORLD={map:new Uint8Array(COLS*ROWS),rects:[],stones:[],spawners:[],checkpoints:[],houses:[],trees:[],decor:[],gate:null,npc:null,mini:null,plateauY:1100};
const tileAt=(c,r)=>(c<0||c>=COLS||r<0||r>=ROWS)?T.STONE:WORLD.map[r*COLS+c];
const setTile=(c,r,v)=>{if(c>=0&&c<COLS&&r>=0&&r<ROWS)WORLD.map[r*COLS+c]=v;};
const isSolidTile=t=>t===T.GRASS||t===T.DIRT||t===T.STONE||t===T.WOOD;

function rectSolid(x,y,w,h){
 const c0=Math.max(0,Math.floor(x/TS)),c1=Math.min(COLS-1,Math.floor((x+w-.01)/TS));
 const r0=Math.max(0,Math.floor(y/TS)),r1=Math.min(ROWS-1,Math.floor((y+h-.01)/TS));
 for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(isSolidTile(WORLD.map[r*COLS+c]))return true;
 for(const rc of WORLD.rects)if(x<rc.x+rc.w&&x+w>rc.x&&y<rc.y+rc.h&&y+h>rc.y)return true;
 return false;
}
function boxTiles(x,y,w,h,type){
 const c0=Math.max(0,Math.floor(x/TS)),c1=Math.min(COLS-1,Math.floor((x+w-.01)/TS));
 const r0=Math.max(0,Math.floor(y/TS)),r1=Math.min(ROWS-1,Math.floor((y+h-.01)/TS));
 for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(WORLD.map[r*COLS+c]===type)return true;
 return false;
}

function buildLevel(){
 RNG=mulberry32(77123);
 WORLD.map.fill(T.AIR); WORLD.rects.length=0; WORLD.stones.length=0; WORLD.spawners.length=0;
 WORLD.checkpoints.length=0; WORLD.houses.length=0; WORLD.trees.length=0; WORLD.decor.length=0;
 const G=178; // surface du sol (y=8900)
 const gaps=[[60,67],[160,167]]; // rivières
 const inGap=c=>gaps.some(g=>c>=g[0]&&c<=g[1]);
 // --- Sol ---
 for(let c=0;c<COLS;c++){
  if(inGap(c)){ for(let r=191;r<199;r++)setTile(c,r,T.WATER); continue; }
  setTile(c,G,T.GRASS);
  for(let r=G+1;r<ROWS;r++)setTile(c,r,T.DIRT);
 }
 // Ponts au-dessus des rivières
 for(const g of gaps)for(let c=g[0];c<=g[1];c++)setTile(c,G,T.WOOD);
 // Murs des bords de carte
 for(let r=60;r<ROWS;r++){setTile(0,r,T.STONE);setTile(1,r,T.STONE);setTile(COLS-2,r,T.STONE);setTile(COLS-1,r,T.STONE);}
 for(let c=0;c<COLS;c++){setTile(c,0,T.STONE);setTile(c,1,T.STONE);}

 // --- Village (Sud-Est) : maisons + décor ---
 const hx=[13600,14700,16600,17700,18800];
 for(const x of hx){
  const w=380+RNG()*200, h=330+RNG()*170, y=G*TS-h;
  WORLD.houses.push({x,y,w,h,roof:60+RNG()*40});
  WORLD.rects.push({x,y,w,h,kind:'house'});
 }
 for(let i=0;i<14;i++)WORLD.decor.push({type:'fence',x:13200+i*480+RNG()*120,y:G*TS});
 for(const lx of [13400,15500,16300,18400,19400])WORLD.decor.push({type:'lantern',x:lx,y:G*TS});

 // --- Arbres géants de la forêt (troncs = murs pour wall-jump) ---
 const trunkX=[1500,2700,4100,5600,7000,8600,10200,11700,12600];
 for(const tx of trunkX){
  // Sous le plateau : les troncs s'arrêtent sous la roche (sinon ils la traversent)
  const top=(tx>7350&&tx<12650)?1380+RNG()*220:4900+RNG()*500;
  WORLD.rects.push({x:tx-42,y:top,w:84,h:G*TS-top,kind:'trunk'});
  WORLD.trees.push({x:tx,y:top,r:230+RNG()*110});
  // branches-plateformes le long du tronc
  let side=1;
  for(let by=G*TS-420;by>top+200;by-=560+RNG()*160){
   const bw=160+RNG()*90;
   const bx=side>0?tx+42:tx-42-bw; side*=-1;
   fillPlat(Math.round(bx/TS),Math.round(by/TS),Math.round(bw/TS),T.WOOD);
   if(RNG()<.55)WORLD.stones.push({x:bx+bw/2,y:by-46,taken:false,ph:RNG()*6});
  }
 }
 function fillPlat(c,r,len,ty){for(let i=0;i<len;i++)setTile(c+i,r,ty);}

 // Premières marches pour quitter le sol de la forêt
 fillPlat(Math.round(3650/TS),Math.round(8720/TS),4,T.WOOD);
 WORLD.stones.push({x:3750,y:8674,taken:false,ph:1});
 // --- Ascension principale : plateformes en lacets vers le Nord ---
 let px=4000,py=8560,dir=1;const plats=[];
 while(py>1500){
  const wpx=py>4300?(200+RNG()*130):(150+RNG()*110);
  plats.push({x:px,y:py,w:wpx,ty:py>4300?T.WOOD:T.STONE});
  px+=dir*(230+RNG()*140);
  if(px<700){px=700;dir=1;} if(px>12200){px=12200;dir=-1;}
  py-=150+RNG()*42;
 }
 for(const p of plats){
  const c=Math.round(p.x/TS),r=Math.round(p.y/TS),len=Math.max(3,Math.round(p.w/TS));
  fillPlat(c,r,len,p.ty);
  if(p.ty===T.STONE){ // contreforts : épaisseur + pics occasionnels
   fillPlat(c,r+1,len,T.STONE);
   if(RNG()<.24){const sc=c+1+Math.floor(RNG()*(len-2));setTile(sc,r-1,T.SPIKE);}
  }
  if(RNG()<.62)WORLD.stones.push({x:p.x+p.w/2,y:p.y-46,taken:false,ph:RNG()*6});
  if(RNG()<.6)WORLD.spawners.push({x:p.x+p.w/2,y:p.y-170,rt:0,live:null});
 }
 // Derniers gradins vers le plateau (escalier extérieur à droite)
 const end=[[11600,1720],[10900,1520],[12300,1480],[12720,1360],[12870,1210]];
 for(const [ex,ey] of end){fillPlat(Math.round(ex/TS),Math.round(ey/TS),5,T.STONE);fillPlat(Math.round(ex/TS),Math.round(ey/TS)+1,5,T.STONE);
  WORLD.stones.push({x:ex+120,y:ey-46,taken:false,ph:RNG()*6});}

 // --- Plateau sommital (Zone Interdite) + arène du boss ---
 const PT=22; // y=1100
 for(let c=148;c<=252;c++)for(let r=PT;r<PT+4;r++)setTile(c,r,T.STONE);
 // Mur gauche de l'arène (le côté droit reste ouvert, l'escalier y mène)
 for(let r=6;r<PT;r++){setTile(148,r,T.STONE);setTile(149,r,T.STONE);}
 for(const sc of [170,171,172,227,228,229])setTile(sc,PT-1,T.SPIKE);
 // Pierres gardées sur le plateau
 WORLD.stones.push({x:8000,y:PT*TS-46,taken:false,ph:0});
 WORLD.stones.push({x:12000,y:PT*TS-46,taken:false,ph:2});

 // --- Sanctuaires (checkpoints) ---
 WORLD.checkpoints.push({x:15900,y:G*TS,used:false});
 WORLD.checkpoints.push({x:6200,y:4650,used:false});
 fillPlat(Math.round(6200/TS)-3,Math.round(4700/TS),7,T.STONE);
 WORLD.checkpoints[1].y=4700;
 WORLD.checkpoints.push({x:12200,y:PT*TS,used:false});

 // --- PNJ + Porte Rouge ---
 WORLD.npc={x:14450,y:G*TS,seen:false};
 WORLD.gate={x:9850,y:PT*TS,open:false};
 // Spawners village (lisière) et forêt basse
 WORLD.spawners.push({x:12900,y:8600,rt:0,live:null},{x:11900,y:8400,rt:0,live:null},{x:3400,y:8300,rt:0,live:null});
 // Compléter le nombre de pierres si besoin (objectif : ~60)
 let guard=0;
 while(WORLD.stones.length<60&&guard++<400){
  const p=plats[Math.floor(RNG()*plats.length)];
  WORLD.stones.push({x:p.x+RNG()*p.w,y:p.y-46-RNG()*90,taken:false,ph:RNG()*6});
 }
 buildMiniMap();
}
function buildMiniMap(){

}

function moveBody(b,dt){
 b.onGround=false;b.hitWall=0;
 let dx=b.vx*dt;
 if(dx!==0){const s=Math.sign(dx);let rem=Math.abs(dx);
  while(rem>.001){const mv=Math.min(rem,6);const nx=b.x+s*mv;
   if(rectSolid(nx+2,b.y+2,b.w-4,b.h-4)){b.hitWall=s;b.vx=0;break;}
   b.x=nx;rem-=mv;}}
 let dy=b.vy*dt;
 if(dy!==0){const s=Math.sign(dy);let rem=Math.abs(dy);
  while(rem>.001){const mv=Math.min(rem,6);const ny=b.y+s*mv;
   if(rectSolid(b.x+2,ny+2,b.w-4,b.h-4)){if(s>0)b.onGround=true;b.vy=0;break;}
   b.y=ny;rem-=mv;}}
 b.x=clamp(b.x,4,MW-b.w-4); b.y=clamp(b.y,4,MH-b.h-4);
}

}

function updatePlayer(dt){
 if(P.dead){P.deadT+=dt;P.vy+=PHYS.GRAV*dt;moveBody(P,dt);
  if(P.deadT>2.4)respawnPlayer(); return;}
 P.inv-=dt;P.healFx-=dt;
 const ax=IN.axis();
 // Dash
 if(IN.pressedAct('dash')&&P.dashCd<=0&&P.dashing<=0){
  const d=ax!==0?Math.sign(ax):P.face; P.face=d;
  P.dashing=PHYS.DASH_T;P.dashCd=PHYS.DASH_CD;P.vx=PHYS.DASH_V*d;P.vy=0;
  AU.dash();
 }
 if(P.dashCd>0)P.dashCd-=dt;
 if(P.dashing>0){
  P.dashing-=dt;P.vx=PHYS.DASH_V*P.face;P.vy=0;
  P.ghosts.push({x:P.x,y:P.y,face:P.face,life:.3});
 } else {
  // Accélération / friction
  if(ax!==0){
   P.face=ax>0?1:-1;
   P.vx+=ax*PHYS.ACC*(P.onGround?1:PHYS.AIRCTL)*dt;
   const mx=PHYS.MAX;
   if(P.vx>mx)P.vx=Math.max(mx,P.vx-PHYS.FRIC*dt);
   if(P.vx<-mx)P.vx=Math.min(-mx,P.vx+PHYS.FRIC*dt);
  } else if(P.onGround){
   const f=PHYS.FRIC*dt;
   if(Math.abs(P.vx)<=f)P.vx=0; else P.vx-=Math.sign(P.vx)*f;
  } else { P.vx*=Math.pow(.995,dt*60); }
  // Gravité + wall slide
  const wl=rectSolid(P.x-4,P.y+4,4,P.h-8),wr=rectSolid(P.x+P.w,P.y+4,4,P.h-8);
  P.wall=wl?-1:wr?1:0;
  P.wallSliding=false;
  P.vy+=PHYS.GRAV*dt;
  if(!P.onGround&&P.wall!==0&&P.vy>0&&((P.wall===1&&ax>0)||(P.wall===-1&&ax<0))){
   P.vy=Math.min(P.vy,PHYS.WALLFALL);P.wallSliding=true;
   if(Math.random()<.4)PARTS.push({x:P.wall>0?P.x+P.w:P.x,y:P.y+10+Math.random()*30,vx:-P.wall*40,vy:60,life:.4,ml:.4,size:2.5,color:'#9aa4b8',type:'dust'});
  }
  if(P.vy>PHYS.MAXFALL)P.vy=PHYS.MAXFALL;
 }
 // Saut : buffer + coyote + double + mural
 if(IN.pressedAct('jump'))P.jbuf=PHYS.JBUF;
 P.jbuf-=dt;
 if(P.jbuf>0){
  if(P.coyote>0){P.vy=-PHYS.JUMP;P.jbuf=0;P.coyote=0;P.jumps=1;AU.jump();burst(P.x+P.w/2,P.y+P.h,6,'#9aa4b8',120);}
  else if(P.wall!==0&&!P.onGround){
   P.vy=-PHYS.WJUMP_Y;P.vx=-P.wall*PHYS.WJUMP_X;P.face=-P.wall;P.jbuf=0;P.jumps=1;P.dashing=0;
   AU.jump();burst(P.x+P.w/2,P.y+P.h/2,8,'#9aa4b8',160);
  }
  else if(P.jumps<2){
   P.vy=-PHYS.DJUMP;P.jumps=2;P.jbuf=0;AU.djump();
   ring(P.x+P.w/2,P.y+P.h-4);
  }
 }
 // Saut variable
 if(!IN.heldAct('jump')&&P.vy<-260&&P.dashing<=0)P.vy=-260;
 P.coyote=P.onGround?PHYS.COYOTE:P.coyote-dt;
 if(P.onGround){P.jumps=0;P.runPhase+=Math.abs(P.vx)*dt*.055;}
 moveBody(P,dt);
 if(P.onGround&&P.jumps>1)P.jumps=0;
 // Attaques + soin + interaction
 if(IN.pressedAct('attack'))tryAttack();
 combatUpdate(dt);
 if(IN.pressedAct('heal'))doHeal();
 if(IN.pressedAct('interact'))interact();
 // Fantômes de dash
 for(let i=P.ghosts.length-1;i>=0;i--){P.ghosts[i].life-=dt;if(P.ghosts[i].life<=0)P.ghosts.splice(i,1);}
 // Pics (contact)
 if(P.inv<=0&&boxTiles(P.x+4,P.y+4,P.w-8,P.h-8,T.SPIKE)){
  damagePlayer(1,-P.face*360,-460);
 }
 // Eau
 if(boxTiles(P.x+4,P.y+P.h-14,P.w-8,14,T.WATER)&&P.vy>=0){
  AU.splash();
  for(let i=0;i<16;i++)PARTS.push({x:P.x+P.w/2+(Math.random()-.5)*30,y:P.y+P.h,vx:(Math.random()-.5)*220,vy:-160-Math.random()*260,life:.6,ml:.6,size:3,color:'#5a9fc8',type:'dust'});
  damagePlayer(1,-P.face*200,-950);
 }
 P.capeFlow=lerp(P.capeFlow,clamp(Math.abs(P.vx)*.045,0,26)+2+Math.sin(GTIME*7)*1.5,dt*6);
}

/* ============ SLACHES (ennemis volants) ============ */
function spawnSlacheAt(x,y){
 if(WORLD.slaches.filter(s=>!s.dead).length>=14)return null;
 const s={x,y,r:17,vx:0,vy:0,hp:3,dead:false,flash:0,bob:Math.random()*6,lastSwing:-1,ax:x,ay:y};
 WORLD.slaches.push(s);return s;
}
function updateSlaches(dt){
 for(const s of WORLD.slaches){
  if(s.dead)continue;
  s.bob+=dt;s.flash-=dt;
  const px=P.x+P.w/2,py=P.y+P.h/2,d=dist(s.x,s.y,px,py)||1;
  if(d<560&&!P.dead){
   s.vx+=((px-s.x)/d)*820*dt; s.vy+=((py-s.y)/d)*820*dt;
   const m=Math.hypot(s.vx,s.vy),mx=245;
   if(m>mx){s.vx=s.vx/m*mx;s.vy=s.vy/m*mx;}
  } else {
   s.vx+=(s.ax-s.x)*1.5*dt; s.vy+=(s.ay-s.y)*1.5*dt+Math.sin(s.bob*2)*40*dt;
   s.vx*=Math.pow(.55,dt); s.vy*=Math.pow(.55,dt);
  }
  s.x+=s.vx*dt; s.y+=s.vy*dt;
  if(!P.dead&&P.inv<=0&&Math.abs(px-s.x)<s.r+P.w/2-2&&Math.abs(py-s.y)<s.r+P.h/2-2)
   damagePlayer(1,Math.sign(px-s.x)*340,-400);
 }
 if(WORLD.slaches.length>80)WORLD.slaches=WORLD.slaches.filter(s=>!s.dead);
 for(const sp of WORLD.spawners){
  if(sp.live&&!sp.live.dead)continue;
  sp.rt-=dt;
  const d=dist(sp.x,sp.y,P.x,P.y);
  if(sp.rt<=0){
   if(d<1500&&d>280){const s=spawnSlacheAt(sp.x,sp.y);if(s){sp.live=s;sp.rt=5;}else sp.rt=1;}
   else sp.rt=1;
  }
 }
}
function killSlache(s){

}

  return;}
 B.phase=B.hp<30?2:1;

 for(let i=B.strikes.length-1;i>=0;i--){B.strikes[i].t-=dt;if(B.strikes[i].t<=0)B.strikes.splice(i,1);}
 const spd=B.phase===2?1.4:1;

   else if(roll<.62){const n=B.phase===2?4:3;

   else{B.state='windup';B.t=.55;B.aimX=px;B.aimY=py;}
  }
 } else if(B.state==='windup'){
  B.t-=dt;B.x=lerp(B.x,B.aimX,dt*2.2);B.y=lerp(B.y,400,dt*3);
  if(B.t<=0){B.state='dive';const dx=B.aimX-B.x,dy=B.aimY-B.y,d=Math.hypot(dx,dy)||1;
   B.vx=dx/d*1180;B.vy=dy/d*1180;AU.noise(.3,900,.2,'bandpass');}
 } else if(B.state==='dive'){
  B.x+=B.vx*dt;B.y+=B.vy*dt;
  if(Math.abs(px-B.x)<B.r+16&&Math.abs(py-B.y)<B.r+20)damagePlayer(2,Math.sign(B.vx)*420,-520);
  if(B.y>=groundY-B.r-6){
   B.y=groundY-B.r-6;B.state='recover';B.t=.8;

   if(P.onGround&&Math.abs(px-B.x)<330)damagePlayer(2,Math.sign(px-B.x)*460,-540);
  }
 } else if(B.state==='recover'){
  B.t-=dt;B.y=lerp(B.y,430,dt*1.5);
  if(B.t<=0){B.state='hover';B.t=1.6/spd;}
 }
}

  PARTS.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.5+Math.random()*.4,ml:.9,size:2+Math.random()*3.5,color,type:'spark'});}

  if(p.life<=0){PARTS.splice(i,1);continue;}
  if(p.type!=='ring'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.type==='rise'?-60:300)*dt;p.vx*=Math.pow(.9,dt*60);}}
}

let WIND=60;

function ridge(f,base,amp,col,seed){

 }

function drawRects(){
 for(const rc of WORLD.rects){
  if(rc.x>CAM.x+W||rc.x+rc.w<CAM.x||rc.y>CAM.y+H||rc.y+rc.h<CAM.y)continue;
  if(rc.kind!=='trunk')continue;
  ctx.fillStyle='#4a3626';ctx.fillRect(rc.x,rc.y,rc.w,rc.h);
  ctx.fillStyle='rgba(0,0,0,.25)';
  for(let yy=rc.y+30;yy<rc.y+rc.h;yy+=90)ctx.fillRect(rc.x+8+(yy*7)%40,yy,10,34);
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(rc.x+rc.w-12,rc.y,6,rc.h);
 }
 for(const hs of WORLD.houses){
  if(hs.x>CAM.x+W||hs.x+hs.w<CAM.x)continue;
  ctx.fillStyle='#3b3340';ctx.fillRect(hs.x,hs.y,hs.w,hs.h);
  ctx.fillStyle='#2c2633';ctx.fillRect(hs.x,hs.y+hs.h-26,hs.w,26);
  ctx.strokeStyle='#241f2b';ctx.lineWidth=5;
  ctx.strokeRect(hs.x+3,hs.y+3,hs.w-6,hs.h-6);
  ctx.beginPath();ctx.moveTo(hs.x,hs.y+hs.h*.55);ctx.lineTo(hs.x+hs.w,hs.y+hs.h*.55);ctx.stroke();
  // fenêtres chaudes
  const nw=Math.floor(hs.w/130);
  for(let i=0;i<nw;i++){
   const wx=hs.x+45+i*(hs.w-90)/Math.max(1,nw-1),wy=hs.y+hs.h*.28;
   ctx.save();ctx.shadowColor='#ffb84d';ctx.shadowBlur=14;
   ctx.fillStyle='#ffb84d';ctx.fillRect(wx,wy,26,34);ctx.restore();
   ctx.strokeStyle='#241f2b';ctx.lineWidth=3;ctx.strokeRect(wx,wy,26,34);
   ctx.beginPath();ctx.moveTo(wx+13,wy);ctx.lineTo(wx+13,wy+34);ctx.stroke();
  }
  // toit rouge
  ctx.fillStyle='#7c1420';
  ctx.beginPath();ctx.moveTo(hs.x-32,hs.y+4);ctx.lineTo(hs.x+hs.w/2,hs.y-hs.roof);ctx.lineTo(hs.x+hs.w+32,hs.y+4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#a3212c';
  ctx.beginPath();ctx.moveTo(hs.x-32,hs.y+4);ctx.lineTo(hs.x+hs.w/2,hs.y-hs.roof);ctx.lineTo(hs.x+hs.w/2+14,hs.y-hs.roof+12);ctx.lineTo(hs.x-18,hs.y+8);ctx.closePath();ctx.fill();
  // porte
  ctx.fillStyle='#241c15';ctx.fillRect(hs.x+hs.w/2-22,hs.y+hs.h-78,44,78);
  ctx.fillStyle='#c9a227';ctx.beginPath();ctx.arc(hs.x+hs.w/2+12,hs.y+hs.h-40,3,0,7);ctx.fill();
 }
}
function drawDecor(){

   ctx.fillStyle='#3a2c1e';ctx.fillRect(d.x,d.y-34,8,34);ctx.fillRect(d.x+34,d.y-34,8,34);
   ctx.fillRect(d.x,d.y-28,42,5);ctx.fillRect(d.x,d.y-14,42,5);
  } else if(d.type==='lantern'){

   ctx.fillStyle=`rgba(255,190,90,${.75*fl+.2})`;ctx.fillRect(d.x-9,d.y-116,18,22);ctx.restore();

function drawShrines(){
 for(let i=0;i<WORLD.checkpoints.length;i++){
  const c=WORLD.checkpoints[i];
  if(c.x<CAM.x-120||c.x>CAM.x+W+120||c.y<CAM.y-160||c.y>CAM.y+H+60)continue;
  ctx.fillStyle='#3f4350';ctx.fillRect(c.x-34,c.y-14,68,14);
  ctx.fillStyle='#4a4f5c';ctx.fillRect(c.x-24,c.y-26,48,12);
  ctx.fillStyle='#333742';ctx.fillRect(c.x-8,c.y-58,16,34);
  const fl=c.used?1:.65,fk=Math.sin(GTIME*13+i*7)*4+Math.sin(GTIME*29+i)*2;
  const gy=c.y-64;
  const gr=ctx.createRadialGradient(c.x,gy-16,4,c.x,gy-16,60*fl);
  gr.addColorStop(0,'rgba(255,170,60,.4)');gr.addColorStop(1,'rgba(255,170,60,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(c.x,gy-16,60*fl,0,7);ctx.fill();
  ctx.fillStyle='#e2622b';
  ctx.beginPath();ctx.moveTo(c.x-12,gy);ctx.quadraticCurveTo(c.x-10,gy-26*fl,c.x+fk*.4,gy-40*fl);ctx.quadraticCurveTo(c.x+10,gy-22*fl,c.x+12,gy);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f5b83d';
  ctx.beginPath();ctx.moveTo(c.x-6,gy);ctx.quadraticCurveTo(c.x-5,gy-16*fl,c.x+fk*.6,gy-26*fl);ctx.quadraticCurveTo(c.x+5,gy-14*fl,c.x+6,gy);ctx.closePath();ctx.fill();
  if(c.used&&Math.random()<.08)PARTS.push({x:c.x+(Math.random()-.5)*16,y:gy-20,vx:(Math.random()-.5)*30,vy:-60-Math.random()*60,life:1,ml:1,size:2,color:'#f5b83d',type:'rise'});
 }
}

function drawStones(){
 for(const st of WORLD.stones){

function drawSlaches(){
 for(const s of WORLD.slaches){
  if(s.dead)continue;
  if(s.x<CAM.x-60||s.x>CAM.x+W+60||s.y<CAM.y-60||s.y>CAM.y+H+60)continue;
  const sq=1+Math.sin(s.bob*6)*.12;
  ctx.save();ctx.translate(s.x,s.y);
  // ailes
  const wf=Math.sin(s.bob*14)*.6;
  ctx.fillStyle='rgba(26,15,38,.75)';
  ctx.beginPath();ctx.ellipse(-16,-4,14,7,-.5+wf,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(16,-4,14,7,.5-wf,0,7);ctx.fill();
  // traîne
  ctx.fillStyle='rgba(20,10,30,.5)';
  ctx.beginPath();ctx.ellipse(0,12,7,12,0,0,7);ctx.fill();
  // corps
  const gr=ctx.createRadialGradient(0,-4,2,0,0,s.r+4);
  gr.addColorStop(0,'#3a2547');gr.addColorStop(1,'#0c0714');
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.ellipse(0,0,s.r*sq,s.r/sq,0,0,7);ctx.fill();
  if(s.flash>0){ctx.fillStyle=`rgba(255,255,255,${s.flash*5})`;ctx.beginPath();ctx.ellipse(0,0,s.r*sq,s.r/sq,0,0,7);ctx.fill();}
  // yeux
  const px=clamp((P.x-s.x)*.02,-3,3);
  ctx.save();ctx.shadowColor='#ff3b4e';ctx.shadowBlur=9;
  ctx.fillStyle='#ff3b4e';
  ctx.beginPath();ctx.arc(-5.5+px,-3,3,0,7);ctx.arc(5.5+px,-3,3,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-5.5+px,-3,1.1,0,7);ctx.arc(5.5+px,-3,1.1,0,7);ctx.fill();
  ctx.restore();
 }
}
function drawBoss(){
 const B=BOSS;if(!B)return;
 // télégraphes de foudre
 for(const tl of B.teles){
  const a=tl.t<.3?.5+Math.sin(GTIME*40)*.2:.22;
  const gr=ctx.createLinearGradient(tl.x-45,0,tl.x+45,0);
  gr.addColorStop(0,'rgba(255,59,78,0)');gr.addColorStop(.5,`rgba(255,59,78,${a})`);gr.addColorStop(1,'rgba(255,59,78,0)');
  ctx.fillStyle=gr;ctx.fillRect(tl.x-45,CAM.y,90,H);
  ctx.strokeStyle=`rgba(255,120,130,${a+.2})`;ctx.lineWidth=2;ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.moveTo(tl.x,CAM.y);ctx.lineTo(tl.x,WORLD.plateauY);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=`rgba(255,59,78,${a+.3})`;
  ctx.beginPath();ctx.ellipse(tl.x,WORLD.plateauY,40,10,0,0,7);ctx.fill();
 }
 // éclairs actifs
 for(const sk of B.strikes){
  ctx.save();
  ctx.shadowColor='#b48cff';ctx.shadowBlur=22;
  ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=5;
  ctx.beginPath();
  let yy=CAM.y-20,xx=sk.x;
  ctx.moveTo(xx,yy);
  while(yy<WORLD.plateauY){yy+=40+Math.random()*50;xx=sk.x+(Math.random()-.5)*46;ctx.lineTo(xx,Math.min(yy,WORLD.plateauY));}
  ctx.stroke();
  ctx.strokeStyle='rgba(180,140,255,.55)';ctx.lineWidth=11;ctx.stroke();
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath();ctx.ellipse(sk.x,WORLD.plateauY,55,14,0,0,7);ctx.fill();
 }
 // corps
 const dy=B.dying?B.dyingT:0;
 ctx.save();
 ctx.translate(B.x,B.y+Math.sin(B.bob*2)*9);
 if(B.dying){ctx.globalAlpha=Math.max(0,1-dy/1.6);ctx.rotate(dy*1.2);}
 const pul=1+Math.sin(B.bob*3)*.05;
 // aura
 const ag=ctx.createRadialGradient(0,0,20,0,0,150*pul);
 ag.addColorStop(0,'rgba(90,50,140,.4)');ag.addColorStop(1,'rgba(90,50,140,0)');
 ctx.fillStyle=ag;ctx.beginPath();ctx.arc(0,0,150*pul,0,7);ctx.fill();
 // tentacules
 ctx.strokeStyle='#2a1638';ctx.lineWidth=11;ctx.lineCap='round';
 for(let i=0;i<6;i++){
  const an=B.bob*.7+i*Math.PI/3,wv=Math.sin(B.bob*2.4+i)*16;
  ctx.beginPath();
  ctx.moveTo(Math.cos(an)*B.r*.7,Math.sin(an)*B.r*.7);
  ctx.quadraticCurveTo(Math.cos(an)*(B.r+42)+wv,Math.sin(an)*(B.r+42),Math.cos(an)*(B.r+74)+wv*1.6,Math.sin(an)*(B.r+74)-wv);
  ctx.stroke();
 }
 ctx.strokeStyle='#46255e';ctx.lineWidth=4;
 for(let i=0;i<6;i++){
  const an=B.bob*.7+i*Math.PI/3,wv=Math.sin(B.bob*2.4+i)*16;
  ctx.beginPath();
  ctx.moveTo(Math.cos(an)*B.r*.8,Math.sin(an)*B.r*.8);
  ctx.quadraticCurveTo(Math.cos(an)*(B.r+40)+wv,Math.sin(an)*(B.r+40),Math.cos(an)*(B.r+70)+wv*1.6,Math.sin(an)*(B.r+70)-wv);
  ctx.stroke();
 }
 // orbe
 const og=ctx.createRadialGradient(-14,-18,6,0,0,B.r*pul);
 og.addColorStop(0,'#3b2452');og.addColorStop(.7,'#1b0f2a');og.addColorStop(1,'#05030a');
 ctx.fillStyle=og;ctx.beginPath();ctx.arc(0,0,B.r*pul,0,7);ctx.fill();
 if(B.flash>0){ctx.fillStyle=`rgba(255,255,255,${B.flash*6})`;ctx.beginPath();ctx.arc(0,0,B.r*pul,0,7);ctx.fill();}
 // couronne d'éclats
 ctx.fillStyle='#b48cff';
 for(let i=0;i<5;i++){
  const an=-Math.PI/2+(i-2)*.5+Math.sin(B.bob*1.6)*.08;
  ctx.save();ctx.translate(Math.cos(an)*(B.r+8),Math.sin(an)*(B.r+8));ctx.rotate(an+Math.PI/2);
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(6,6);ctx.lineTo(-6,6);ctx.closePath();ctx.fill();ctx.restore();
 }
 // œil cosmique
 const look=clamp((P.x-B.x)*.015,-8,8),lookY=clamp((P.y-B.y)*.01,-5,5);
 ctx.fillStyle='#efe9ff';ctx.beginPath();ctx.ellipse(0,0,30,22,0,0,7);ctx.fill();
 const ig=ctx.createRadialGradient(look,lookY,2,look,lookY,15);
 ig.addColorStop(0,'#7de8e0');ig.addColorStop(.55,'#5a3fd6');ig.addColorStop(1,'#2a0f4a');
 ctx.fillStyle=ig;ctx.beginPath();ctx.arc(look,lookY,14,0,7);ctx.fill();
 ctx.fillStyle='#05030a';ctx.beginPath();ctx.ellipse(look,lookY,4,10,0,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(look-5,lookY-5,3,0,7);ctx.fill();
 // étoiles orbitales
 ctx.fillStyle='#e8d17a';
 for(let i=0;i<4;i++){
  const an=B.bob*1.3+i*Math.PI/2;
  ctx.beginPath();ctx.arc(Math.cos(an)*105,Math.sin(an)*40,2.6,0,7);ctx.fill();
 }
 ctx.restore();
}
/* --- KYA --- */
function roundRectPath(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const easeOut=p=>1-(1-p)*(1-p);
function drawKyaBody(x,y,face,ghost){
 const fy=y+P.h,cx=x+P.w/2;
 ctx.save();ctx.translate(cx,fy);ctx.scale(face,1);
 const run=P.onGround&&Math.abs(P.vx)>40;
 const ph=P.runPhase;
 const bob=run?Math.sin(ph*2)*1.8:Math.sin(GTIME*2.2)*.8;
 let lean=P.dashing>0?.3:(run?.1:0);
 if(!P.onGround&&P.dashing<=0)lean=clamp(P.vx*face/2600,-.12,.3)+(P.wallSliding?-.15:0);
 ctx.rotate(lean);
 const skin='#e8c9a8',hair='#241b2b',tunic='#303542';
 // cape rouge
 const fl=ghost?10:P.capeFlow,wv=Math.sin(GTIME*9)*3;
 ctx.fillStyle='#7c0f1b';
 ctx.beginPath();ctx.moveTo(-3,-34+bob);
 ctx.quadraticCurveTo(-14-fl*.7,-26+bob+wv,-12-fl,-8+wv*1.4);
 ctx.quadraticCurveTo(-6-fl*.4,-14+bob,-4,-16+bob);
 ctx.closePath();ctx.fill();
 ctx.fillStyle='#a31621';
 ctx.beginPath();ctx.moveTo(-2,-35+bob);
 ctx.quadraticCurveTo(-10-fl*.6,-30+bob-wv,-9-fl*.85,-12+wv);
 ctx.lineTo(-4-fl*.3,-16+bob);
 ctx.closePath();ctx.fill();
 // jambes
 ctx.strokeStyle='#22252e';ctx.lineWidth=6;ctx.lineCap='round';
 const sw=run?Math.sin(ph)*8:(P.onGround?0:5);
 ctx.beginPath();ctx.moveTo(2,-20+bob);ctx.lineTo(4+sw,-3);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-3,-20+bob);ctx.lineTo(-5-sw,-3);ctx.stroke();
 ctx.fillStyle='#181a20';ctx.fillRect(-2+sw,-6,9,6);ctx.fillRect(-11-sw,-6,9,6);
 // torse
 ctx.fillStyle=tunic;roundRectPath(-8,-36+bob,16,19,4);ctx.fill();
 ctx.fillStyle='#8a6d1f';ctx.fillRect(-8,-22+bob,16,3);
 // bras arrière
 ctx.strokeStyle='#282c38';ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(-5,-32+bob);ctx.lineTo(-9,-23+bob);ctx.stroke();
 // tête
 ctx.fillStyle=skin;ctx.beginPath();ctx.arc(3,-42+bob,7.5,0,7);ctx.fill();
 ctx.fillStyle=hair;ctx.beginPath();ctx.arc(1,-43+bob,8,Math.PI*.9,Math.PI*2.05);ctx.fill();
 ctx.fillRect(-7,-47+bob,8,13);
 ctx.fillStyle='#1a1216';ctx.fillRect(6.5,-43+bob,2,2.6);
 ctx.strokeStyle='#1a1216';ctx.lineWidth=1.4;
 ctx.beginPath();ctx.moveTo(5,-46.5+bob);ctx.lineTo(9.5,-45.5+bob);ctx.stroke();
 // épée + bras
 let a;
 if(P.atkT>0&&!ghost){
  const pr=1-P.atkT/PHYS.ATK_T;
  if(P.atkDir==='h')a=lerp(-1.5,1.15,easeOut(pr));
  else if(P.atkDir==='u')a=lerp(1.3,-2.3,easeOut(pr));
  else a=lerp(-.5,2.1,easeOut(pr));
 } else if(P.wallSliding)a=-.9;

 else if(run)a=.6+Math.sin(ph*2)*.15;
 else a=.85+Math.sin(GTIME*2.2)*.05;
 const sx=5,sy=-31+bob;

 ctx.strokeStyle='#303542';ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(sx-2,sy);ctx.lineTo(hx,hy);ctx.stroke();

 ctx.strokeStyle='#c9a227';ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(hx+Math.cos(a+Math.PI/2)*5,hy+Math.sin(a+Math.PI/2)*5);

 if(glow){ctx.shadowColor='#9fd4ff';ctx.shadowBlur=10;}
 ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+Math.cos(a)*34,hy+Math.sin(a)*34);ctx.stroke();
 ctx.shadowBlur=0;
 if(glow){
  const pr=1-P.atkT/PHYS.ATK_T;let a0,a1;
  if(P.atkDir==='h'){a0=-1.5;a1=lerp(-1.5,1.15,easeOut(pr));}

function startDialogue(lines,onEnd){
 DIAL.open=true;DIAL.lines=lines;DIAL.i=0;DIAL.chars=0;DIAL.timer=0;DIAL.onEnd=onEnd||null;
 document.getElementById('dialog').classList.remove('hidden');
 renderDial();
}
function renderDial(){
 const ln=DIAL.lines[DIAL.i];
 document.getElementById('dname').textContent=t('n_'+ln.who);
 document.getElementById('dtext').textContent='';
 drawPortrait(ln.who);
}
function syncDialText(){document.getElementById('dtext').textContent=DIAL.lines[DIAL.i].t.slice(0,Math.floor(DIAL.chars));}
function advanceDialogue(){
 const ln=DIAL.lines[DIAL.i];
 if(DIAL.chars<ln.t.length){DIAL.chars=ln.t.length;syncDialText();return;}
 DIAL.i++;
 if(DIAL.i>=DIAL.lines.length){closeDialogue();return;}
 DIAL.chars=0;DIAL.timer=0;renderDial();
}
function closeDialogue(){
 DIAL.open=false;
 document.getElementById('dialog').classList.add('hidden');
 const cb=DIAL.onEnd;DIAL.onEnd=null;
 if(cb)cb();
}
function updateDialogue(dt){
 if(!DIAL.open)return;
 const ln=DIAL.lines[DIAL.i];
 if(DIAL.chars<ln.t.length){
  DIAL.timer+=dt;
  const nc=Math.min(ln.t.length,DIAL.timer/.018);
  if(Math.floor(nc)>Math.floor(DIAL.chars)&&Math.floor(nc)%2===0)AU.tick();
  DIAL.chars=nc;syncDialText();
 }
}
document.getElementById('dialog').addEventListener('click',()=>{if(DIAL.open)advanceDialogue();});

/* ============ INTERACTIONS ============ */
function interact(){
 if(DIAL.open){advanceDialogue();return;}
 const it=nearInteractable();if(!it)return;
 const px=P.x+P.w/2,py=P.y+P.h/2;
 const n=WORLD.npc;
 if(n&&dist(px,py,n.x,n.y-40)<120){n.seen=true;startDialogue(T_.d_elder);return;}
 for(const c of WORLD.checkpoints){
  if(dist(px,py,c.x,c.y-40)<110){
   const first=!c.used;c.used=true;CP={x:c.x,y:c.y};P.hp=10;
   AU.heal();burst(c.x,c.y-50,16,'#e8d17a',240);
   startDialogue(first?T_.d_fire:T_.d_fire2);return;
  }
 }
 const g=WORLD.gate;
 if(g&&!g.open&&dist(px,py,g.x+150,g.y-160)<300){
  if(STATS.keys>=15&&!BOSS){
   g.open=true;AU.gate();addShake(8,.6);
   startDialogue(T_.d_gateopen,bossStart);
  } else if(!BOSS){
   AU.deny();
   startDialogue([{who:'gate',t:T_.d_gatelock[0].t.replace('{n}',String(15-STATS.keys))}]);
  }
 }
}

 const mins=Math.floor(PLAYTIME/60),secs=Math.floor(PLAYTIME%60);
 document.getElementById('vicStats').innerHTML=
  '<div>'+t('stTime')+'</div><div><b>'+mins+':'+String(secs).padStart(2,'0')+'</b></div>'+
  '<div>'+t('stKills')+'</div><div><b>'+(STATS.totalKills||0)+'</b></div>'+
  '<div>'+t('stStones')+'</div><div><b>'+(STATS.totalStones||0)+'</b></div>'+
  '<div>'+t('stKeys')+'</div><div><b>'+STATS.keys+'</b></div>';
 document.getElementById('victory').classList.remove('hidden');
}
function switchTab(x){
 for(const nb of ['Ctl','Aud','Game']){
  document.getElementById('tab'+nb).classList.toggle('active',nb===x);
  document.getElementById('opt'+nb).classList.toggle('hidden',nb!==x);
 }
}
document.getElementById('btnPlay').onclick=()=>{AU.init();startGame();};
document.getElementById('btnQuit').onclick=()=>{toast(t('quitMsg'));setTimeout(()=>{try{window.close();}catch(e){}},1800);};
document.getElementById('btnOpts1').onclick=()=>openOptions('menu');
document.getElementById('btnOpts2').onclick=()=>openOptions('pause');
document.getElementById('btnResume').onclick=resumeGame;
document.getElementById('btnToMenu').onclick=toMenu;
document.getElementById('btnOptsBack').onclick=closeOptions;
document.getElementById('tabCtl').onclick=()=>switchTab('Ctl');
document.getElementById('tabAud').onclick=()=>switchTab('Aud');
document.getElementById('tabGame').onclick=()=>switchTab('Game');
document.getElementById('btnReplay').onclick=()=>{AU.init();startGame();};
document.getElementById('btnContinue').onclick=()=>{document.getElementById('victory').classList.add('hidden');STATE='playing';};

/* ============ RENDU COMPLET ============ */
function drawFrame(){
 drawSky();
 const alt=clamp(1-(CAM.y+H/2)/MH,0,1);
 ridge(.12,H*.5,70,lerpColor('#2a3038','#170f22',alt),3.1);
 ridge(.25,H*.62,60,lerpColor('#232830','#120b1c',alt),7.7);
 ridge(.42,H*.78,52,lerpColor('#1b1f26','#0d0814',alt),12.4);
 ctx.fillStyle='rgba(140,150,180,.05)';
 for(let i=0;i<3;i++){
  const fx=((GTIME*(14+i*7)+i*600)%(W+900))-450;
  ctx.beginPath();ctx.ellipse(fx,H*.3+i*160,430,60,0,0,7);ctx.fill();
 }
 const shx=SHAKE.t>0?(Math.random()-.5)*2*SHAKE.mag:0;
 const shy=SHAKE.t>0?(Math.random()-.5)*2*SHAKE.mag:0;
 ctx.save();
 ctx.translate(Math.round(-CAM.x+shx),Math.round(-CAM.y+shy));
 drawTrees();
 drawTiles();
 drawRects();
 drawDecor();
 drawShrines();
 drawStones();
 drawNPC();
 drawGate();
 drawSlaches();
 drawKya();
 drawBoss();
 drawParticles();
 ctx.restore();
 drawRain();
 if(FLASH.a>0){ctx.fillStyle=`rgba(200,215,255,${FLASH.a*.4})`;ctx.fillRect(0,0,W,H);}
 if(STATE!=='menu'){
  drawHUD();
  drawInteractBubble();
  if(P.hp<=3&&!P.dead){
   const a=.12+Math.sin(GTIME*5)*.08;
   const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);
   vg.addColorStop(0,'rgba(160,10,20,0)');vg.addColorStop(1,`rgba(160,10,20,${a})`);
   ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }
 }
}

/* ============ BOUCLE PRINCIPALE ============ */
let lastT=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 let dt=(now-lastT)/1000;lastT=now;
 dt=Math.min(dt,1/28);
 GTIME+=dt;
 pollGamepad();
 if(IN.pressedAct('pause')){
  if(optsOpen())closeOptions();
  else if(STATE==='playing'||STATE==='boss')pauseGame();
  else if(STATE==='paused')resumeGame();
 }
 updateRain(dt);
 if(STATE==='menu'){
  attractT+=dt;attractCam();
  updateParticles(dt);
  drawFrame();IN.endFrame();return;
 }
 if(STATE==='paused'||optsOpen()){drawFrame();IN.endFrame();return;}
 if(DIAL.open){
  updateDialogue(dt);
  if(IN.pressedAct('interact')||IN.pressedAct('jump')||IN.pressedAct('attack'))advanceDialogue();
  updateParticles(dt);updateCamera(dt);
  drawFrame();IN.endFrame();return;
 }
 if(STATE==='playing'||STATE==='boss'){
  PLAYTIME+=dt;
  updatePlayer(dt);
  updateSlaches(dt);
  updateStones(dt);
  if(BOSS)updateBoss(dt);
  updateParticles(dt);
  updateCamera(dt);
  updateZone();
  if(P.dead){
   const de=document.getElementById('dead');
   if(de.classList.contains('hidden')){
    document.getElementById('deadTitle').textContent=t('deadTitle');
    document.getElementById('deadSub').textContent=t('deadSub');
    de.classList.remove('hidden');
    requestAnimationFrame(()=>de.classList.add('show'));
   }
  }
 }
 drawFrame();
 IN.endFrame();
}

/* ============ INITIALISATION ============ */
loadSettings();
applyLang();
buildLevel();
attractCam();
requestAnimationFrame(loop);

</script>
