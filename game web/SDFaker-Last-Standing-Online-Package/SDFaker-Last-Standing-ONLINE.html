<script>
/* SDFaker online-only transport + controller support (v1.1)
   Set SDFAKER_SERVER_URL to your deployed WSS endpoint, ending in /ws. */
window.SDFAKER_SERVER_URL = window.SDFAKER_SERVER_URL || "wss://YOUR-SDFaker-SERVER-DOMAIN/ws"; // Replace with your deployed WSS endpoint.
(() => {
  "use strict";
  const configuredUrl = () => {
    const raw = String(window.SDFAKER_SERVER_URL || "").trim();
    if (!raw || raw.includes("YOUR-SDFaker-SERVER-DOMAIN")) return "";
    if (raw.startsWith("https://")) return "wss://" + raw.slice(8).replace(/\/$/, "") + (raw.endsWith("/ws") ? "" : "/ws");
    if (raw.startsWith("http://")) return "ws://" + raw.slice(7).replace(/\/$/, "") + (raw.endsWith("/ws") ? "" : "/ws");
    return raw;
  };

  class SDFakerOnlineTransport {
    constructor() { this.url = configuredUrl(); this.ws = null; this.opening = null; this.seq = 0; this.pending = new Map(); }
    async connect() {
      this.url = configuredUrl();
      if (!this.url) throw new Error("server-not-configured");
      if (this.ws && this.ws.readyState === WebSocket.OPEN) return this.ws;
      if (this.opening) return this.opening;
      const opening = new Promise((resolve, reject) => {
        let socket, timeout = 0, settled = false;
        const finish = (error, value) => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          error ? reject(error) : resolve(value);
        };
        try { socket = new WebSocket(this.url); }
        catch (err) { finish(err); return; }
        this.ws = socket;
        timeout = setTimeout(() => {
          finish(new Error("connect-timeout"));
          try { socket.close(); } catch {}
        }, 7000);
        socket.onopen = () => finish(null, socket);
        socket.onerror = () => finish(new Error("network"));
        socket.onmessage = event => {
          let msg; try { msg = JSON.parse(event.data); } catch { return; }
          const pending = this.pending.get(msg.rid);
          if (!pending) return;
          clearTimeout(pending.timer); this.pending.delete(msg.rid);
          pending.resolve(msg.data || { ok: false, err: "server" });
        };
        socket.onclose = () => {
          finish(new Error("network"));
          for (const [id, pending] of this.pending) { clearTimeout(pending.timer); pending.reject(new Error("network")); this.pending.delete(id); }
          if (this.ws === socket) this.ws = null;
        };
      });
      this.opening = opening;
      try { return await opening; }
      finally { if (this.opening === opening) this.opening = null; }
    }
    async call(action, payload = {}) {
      const ws = await this.connect();
      const rid = ++this.seq;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { this.pending.delete(rid); reject(new Error("request-timeout")); }, action === "sync" ? 5000 : 8000);
        this.pending.set(rid, { resolve, reject, timer });
        try { ws.send(JSON.stringify({ rid, action, payload })); }
        catch (err) { clearTimeout(timer); this.pending.delete(rid); reject(err); }
      });
    }
    join() { return this.call("join", {}); }
    claim(id, name, code) { return this.call("claim", { id, name, code }); }
    start(id, name, code, app) { return this.call("start", { id, name, code, app }); }
    prep(id) { return this.call("prep", { id }); }
    leave(id) { return this.call("leave", { id }); }
    sync(id, packet) { return this.call("sync", { ...packet, id }); }
    status() { return this.call("status", {}); }
    close() { if (this.ws) this.ws.close(1000, "page leaving"); }
  }

  const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const getPad = () => {
    try { return Array.from(navigator.getGamepads ? navigator.getGamepads() : []).find(p => p && p.connected) || null; }
    catch { return null; }
  };
  const axis = value => {
    const dead = .16, abs = Math.abs(value || 0);
    if (abs <= dead) return 0;
    return Math.sign(value) * Math.min(1, (abs - dead) / (1 - dead));
  };
  const pressed = button => !!button && (button.pressed || (Number(button.value) || 0) > .55);

  let patchedEngine = null;
  function patchEngine(eng) {
    if (!eng || patchedEngine === eng) return;
    patchedEngine = eng;
    const transport = new SDFakerOnlineTransport();
    try { localStorage.removeItem("sdfaker.bots"); } catch {}
    // One-time migration: older local saves may have retained an inverted-Y preference.
    try {
      if (localStorage.getItem("sdfaker.camera-direction-v3") !== "1") {
        if (eng.S) eng.S.invertY = false;
        if (eng.save && eng.save.settings) eng.save.settings.invertY = false;
        if (eng.save) { localStorage.setItem("sdfaker.save", JSON.stringify(eng.save)); }
        localStorage.setItem("sdfaker.camera-direction-v3", "1");
      }
    } catch {}
    eng.transport = transport;
    eng.gamepadActive = false;
    eng.gamepadButtons = [];
    eng.padUiButtons = []; eng.padUiAt = 0; eng.padUiIndex = 0; eng.padUiState = [];

    const originalInputActive = eng.inputActive.bind(eng);
    eng.inputActive = function() {
      return originalInputActive() || (this.gamepadActive && this.hud.phase === "playing" && !this.hud.paused);
    };
    const originalRequestLock = eng.requestLock.bind(eng);
    eng.requestLock = function() {
      const pad = getPad();
      if (pad) {
        this.gamepadActive = true;
        this.hud.locked = true;
        this.hud.everLocked = true;
        this.hud.paused = false;
        return;
      }
      return originalRequestLock();
    };
    const originalUpdatePlay = eng.updatePlay.bind(eng);
    eng.updatePlay = function(dt) {
      const pad = getPad();
      if (pad) {
        this.gamepadActive = true;
        const axes = pad.axes || [];
        const buttons = pad.buttons || [];
        this.input.mx = axis(axes[0] || 0);
        this.input.my = -axis(axes[1] || 0);
        this.input.lookDX += axis(axes[2] || 0) * dt * 850;
        this.input.lookDY += axis(axes[3] || 0) * dt * 850;
        this.input.jump = pressed(buttons[0]);
        this.input.aim = pressed(buttons[6]) || pressed(buttons[4]);
        this.input.fire = pressed(buttons[7]) || pressed(buttons[5]);
        this.input.run = pressed(buttons[10]);
        const edge = index => pressed(buttons[index]) && !this.gamepadButtons[index];
        if (edge(2)) this.doReload();
        if (edge(1)) this.doHeal();
        if (edge(3)) this.doPickup();
        if (edge(9) && this.hud.phase === "playing") this.pause();
        this.gamepadButtons = buttons.map(pressed);
      } else if (this.gamepadActive) {
        this.gamepadActive = false; this.gamepadButtons = [];
        this.input.mx = 0; this.input.my = 0; this.input.lookDX = 0; this.input.lookDY = 0;
        this.input.jump = false; this.input.aim = false; this.input.fire = false; this.input.run = false;
        this.hud.touch = !!this.touchEnabled;
        if (!this.touchEnabled) { this.hud.locked = false; this.hud.everLocked = false; this.hud.paused = false; }
      }
      return originalUpdatePlay(dt);
    };

    // Controller status is polled even in the preparation room so it can start the match without pointer-lock.
    setInterval(() => {
      if (patchedEngine !== eng) return;
      const pad = getPad();
      const connected = !!pad;
      if (connected) {
        eng.gamepadActive = true;
        if (!eng.touchEnabled) eng.hud.touch = true; // controller users do not need the touch overlay
        // Menu and preparation navigation is handled once by patchUi below.
      } else if (eng.gamepadActive) {
        eng.gamepadActive = false;
        eng.padUiState = [];
        eng.hud.touch = !!eng.touchEnabled;
        if (!eng.touchEnabled) { eng.hud.locked = false; eng.hud.everLocked = false; eng.hud.paused = false; }
      }
      const box = document.getElementById("box");
      if (box) box.classList.toggle("gamepad-no-touch", connected && !eng.touchEnabled);
    }, 150);

    // The legacy single-file demo used an in-memory session and seven default bots.
    // It is intentionally bypassed. No fake local player count is ever shown.
    window.SDFAKER_ONLINE_TRANSPORT = transport;
    window.addEventListener("beforeunload", () => transport.close(), { once: true });
  }

  function renderOnlineStatus(ui) {
    const panel = ui && ui.regions && ui.regions.stat;
    if (!panel || !panel.isConnected || ui.screen !== "menu") return;
    const snap = ui._onlineSnapshot || { ok: false, online: 0, sessionActive: false, record: 0 };
    const t = key => ui.t(key);
    const label = snap.ok ? t("conn.online") : t("conn.offline");
    const dot = snap.ok ? "bg-green" : "bg-red";
    const html = `<div class="row end gap2"><span class="dot ${dot}"></span>${escapeHtml(label)}</div>` +
      (snap.ok
        ? `<div class="text-dim mt1">${snap.sessionActive ? escapeHtml(t("conn.active")) + " · " + snap.online + " " + escapeHtml(t("conn.players")) : escapeHtml(t("conn.idle"))}</div><div class="text-dim2">${escapeHtml(t("conn.record"))}: ${snap.record}</div>`
        : `<div class="text-dim2 mt1">${escapeHtml(t("misc.serverDown"))}</div>`);
    if (panel.innerHTML !== html) panel.innerHTML = html;
  }

  async function refreshOnlineStatus(ui) {
    const transport = window.SDFAKER_ONLINE_TRANSPORT;
    if (!transport || !ui) return;
    let result;
    try { result = await transport.status(); }
    catch { result = { ok: false, online: 0, sessionActive: false, record: 0 }; }
    ui._onlineSnapshot = {
      ok: !!result.ok,
      online: Number(result.online) || 0,
      sessionActive: !!result.sessionActive,
      maxPlayers: Number(result.maxPlayers) || 32,
      record: Number(result.record) || 0
    };
    renderOnlineStatus(ui);
  }

  let uiPatched = null;
  function patchUi(ui) {
    if (!ui || uiPatched === ui || !ui.eng) return;
    uiPatched = ui;
    ui._onlineSnapshot = { ok: false, online: 0, sessionActive: false, record: 0 };
    // The legacy bundle has a local status painter. Observe its output and immediately
    // replace it with the authoritative backend status, never a local/demo player count.
    const panel = ui.regions && ui.regions.stat;
    if (panel && typeof MutationObserver !== "undefined") {
      const observer = new MutationObserver(() => renderOnlineStatus(ui));
      observer.observe(panel, { childList: true, subtree: true, characterData: true });
      window.addEventListener("beforeunload", () => observer.disconnect(), { once: true });
    }
    renderOnlineStatus(ui);
    refreshOnlineStatus(ui);
    const controlsObserver = new MutationObserver(() => {
      if (ui.overlay !== "controls" || !ui.ui) return;
      const body = ui.ui.querySelector(".sd-panel .panel-body");
      if (!body || body.querySelector(".sdfaker-gamepad-guide")) return;
      const lang = ui.save && ui.save.lang || "en";
      const messages = {
        en: "GAMEPAD · Left stick: move · Right stick: camera · RT: fire · LT: aim · A: jump · X: reload · B: heal · Y: collect heal · L3: run · START: pause.",
        fr: "MANETTE · Stick gauche : déplacement · Stick droit : caméra · RT : tirer · LT : viser · A : sauter · X : recharger · B : soin · Y : récupérer un soin · L3 : courir · START : pause.",
        mg: "MANETTE · Stick havia: mihetsika · Stick havanana: fakan-tsary · RT: mitifitra · LT: mikendry · A: mitsambikina · X: mameno · B: mitsabo · Y: maka fanafody · L3: mihazakazaka · START: fiatoana."
      };
      const guide = document.createElement("div");
      guide.className = "hint mt4 sdfaker-gamepad-guide";
      guide.textContent = messages[lang] || messages.en;
      body.append(guide);
    });
    if (ui.ui) controlsObserver.observe(ui.ui, { childList: true, subtree: true });
    window.addEventListener("beforeunload", () => controlsObserver.disconnect(), { once: true });

    // Gamepad menu navigation: D-pad / left stick moves focus, A activates, B closes a panel.
    let previousUiButtons = [], lastUiMove = 0, focusIndex = -1;
    setInterval(() => {
      if (uiPatched !== ui) return;
      const pad = getPad();
      if (!pad) { previousUiButtons = []; return; }
      const playingUnpaused = ui.hud && ui.hud.phase === "playing" && !ui.hud.paused;
      if (playingUnpaused) { previousUiButtons = (pad.buttons || []).map(pressed); return; }
      const scope = ui.overlay ? ui.ui : (ui.regions.pause || ui.regions.death || ui.regions.prep || ui.regions.menu || ui.ui);
      if (!scope) return;
      const controls = Array.from(scope.querySelectorAll("button:not(:disabled), input:not(:disabled), select:not(:disabled)"))
        .filter(el => el.getClientRects().length && getComputedStyle(el).visibility !== "hidden");
      const buttons = pad.buttons || [];
      const edge = index => pressed(buttons[index]) && !previousUiButtons[index];
      const up = edge(12) || (axis(pad.axes && pad.axes[1] || 0) < -.65 && Date.now()-lastUiMove > 260);
      const down = edge(13) || (axis(pad.axes && pad.axes[1] || 0) > .65 && Date.now()-lastUiMove > 260);
      if (controls.length && (up || down)) {
        const active = controls.indexOf(document.activeElement);
        focusIndex = active >= 0 ? active : (focusIndex >= 0 ? focusIndex : (down ? -1 : 0));
        focusIndex = (focusIndex + (down ? 1 : -1) + controls.length) % controls.length;
        controls[focusIndex].focus({ preventScroll: true });
        controls[focusIndex].scrollIntoView({ block: "nearest", inline: "nearest" });
        lastUiMove = Date.now();
      }
      if (edge(0)) {
        const active = controls.includes(document.activeElement) ? document.activeElement : controls[Math.max(0, focusIndex)];
        if (active && typeof active.click === "function") active.click();
      }
      if (edge(1) && ui.overlay) {
        const close = scope.querySelector(".head-pad button, .prep-head button");
        if (close) close.click();
      }
      previousUiButtons = buttons.map(pressed);
    }, 90);

    setInterval(() => { if (uiPatched === ui) refreshOnlineStatus(ui); }, 2500);
  }

  const bootPatch = setInterval(() => {
    const sd = window.SD;
    if (sd && sd.eng) patchEngine(sd.eng);
    const ui = window.SDUI;
    if (ui && ui.eng && window.SDFAKER_ONLINE_TRANSPORT) patchUi(ui);
    if (patchedEngine && uiPatched) clearInterval(bootPatch);
  }, 50);
})();
</script>
