udio:"Generative soundscapes",cr_cast:"Starring",cr_kya:"KYA — the sword-bearer",cr_entities:"THE SIX COSMIC ENTITIES — ever watching",cr_boss:"THE ECLICOSMIC — the false god",cr_thanks:"Thank you for playing",cr_end:"The Six Entities watch over the island, forever.",victory_piece:"Fragment of legend"},H2={fr:B2,en:F2},Tt=(r,t)=>H2[r][t],G2={fr:{elder_first:[{speaker:"ANCIENNE VOAHANGY",text:"Une étrangère, échouée sur notre rive… L'océan ne recrache jamais rien par bonté, enfant."},{speaker:"KYA",text:"Je cherche mon frère. Ma barque s'est brisée dans la tempête. Où suis-je ?"},{speaker:"ANCIENNE VOAHANGY",text:"Sur l'île sans nom. Ici, la pluie tombe depuis cent ans, sans une seule accalmie. Elle est l'œuvre de celui qu'on nomme l'Éclicosmique."},{speaker:"ANCIENNE VOAHANGY",text:"Prends cette épée. Elle a appartenu à une gardienne, autrefois. Si tu veux des réponses, écoute l'île."},{speaker:"ANCIENNE VOAHANGY",text:"Au nord dort une Porte Rouge. Quinze Clés en scellent le passage. Trouve-les toutes… et peut-être verras-tu le ciel."},{speaker:"ANCIENNE VOAHANGY",text:"Une dernière chose. Les Slaches rôdent dans la forêt. Chaque bête abattue nourrit ta jauge de soin. Le sang versé te guérira."}],elder_repeat:[{speaker:"ANCIENNE VOAHANGY",text:"Quinze Clés, Kya. Certaines brillent sur les collines, d'autres se méritent : le sang des Slaches, les pierres de Mira…"}],elder_fifteen:[{speaker:"ANCIENNE VOAHANGY",text:"Quinze Clés… Ainsi la légende choisit sa lame. Écoute-moi bien, enfant."},{speaker:"ANCIENNE VOAHANGY",text:"L'Éclicosmique n'est pas un dieu. C'est un imposteur qui s'est couronné de notre ciel. Les vraies divinités sont les Six Entités Cosmiques."},{speaker:"ANCIENNE VOAHANGY",text:"Elles sont invincibles, et elles attendent, derrière la Porte. Ne les crains pas. Crains celui qui se fait passer pour elles."},{speaker:"KYA",text:"Alors je trancherai la pluie à sa source. Pour mes parents. Pour mon frère."}],mira:[{speaker:"MIRA LA COLLECTEUSE",text:"Oh ! Une guerrière ! Regarde ces mains, elles tremblent depuis que je compte les pierres…"},{speaker:"MIRA LA COLLECTEUSE",text:"Les Pierres Bleues pleurent une douce lumière dans la forêt. Trente, il m'en faut trente pour réparer le puits !"},{speaker:"MIRA LA COLLECTEUSE",text:"Rapporte-les-moi, et je te donnerai quelque chose de brillant. Quelque chose qui ouvre les chemins…"}],mira_progress:[{speaker:"MIRA LA COLLECTEUSE",text:"Le puits attend encore, courage ! Les pierres aiment les racines tordues et le sable humide."}],mira_done:[{speaker:"MIRA LA COLLECTEUSE",text:"Trente ! TRENTE ! Tu as des yeux de hibou, guerrière ! Voici ta récompense : une Clé du vieux monde."}],mira_after:[{speaker:"MIRA LA COLLECTEUSE",text:"Le puits chantera bientôt. Tu restes mon héroïne préférée, ne le dis à personne."}],tovo:[{speaker:"TOVO LE PÊCHEUR",text:"Avant, dit mon grand-père, le ciel ici était si bleu qu'il faisait mal aux yeux."},{speaker:"TOVO LE PÊCHEUR",text:"Puis l'Éclicosmique est venu. Il a fermé le soleil comme on ferme une porte, et la pluie est devenue notre toit."},{speaker:"TOVO LE PÊCHEUR",text:"Même les poissons ont oublié le goût de la lumière, tu imagines ?"}],anja:[{speaker:"PETITE ANJA",text:"Chuuut… Je collectionne les éclairs. Celui d'hier soir était doré, tu l'as vu ?"},{speaker:"PETITE ANJA",text:"Maman dit que tu vas arrêter la pluie. Si c'est vrai, je te dessinerai un soleil. Un très grand."}],sign_village:[{speaker:"PANNEAU GRAVÉ",text:"VILLAGE D'AMBOROA — Ici, nulle lame ne se dégaine. Refuge sous la pluie."}],sign_forest:[{speaker:"PANNEAU MOISSI",text:"FORÊT DES MURMURES — Les Slaches mordent dans le dos. Cours, ou frappe la première."}],sign_gate:[{speaker:"STÈLE ÉCARLATE",text:"ZONE INTERDITE — Quinze Clés, un seul chemin. Le faux dieu écoute."}],monolith:[{speaker:"ENTITÉ COSMIQUE",text:"…"},{speaker:"ENTITÉ COSMIQUE",text:"Nous sommes antérieures au premier grain de sable. L'imposteur a volé notre tonnerre, enfant de la mer."},{speaker:"ENTITÉ COSMIQUE",text:"Nous ne saignons pas. Nous ne mourons pas. Mais lui… lui peut tomber. Tranche son ciel, et le nôtre reviendra."}],victory:[{speaker:"LES SIX ENTITÉS",text:"Il est accompli. Le voleur de ciel n'est plus."},{speaker:"LES SIX ENTITÉS",text:"Regarde, Kya, fille de l'an 2202. Regarde ce que cent ans de pluie avaient caché."},{speaker:"KYA",text:"Le soleil… Quelque part, mon frère doit le voir aussi."}],boss_intro:[{speaker:"L'ÉCLICOSMIQUE",text:"UNE MORTELLE, DANS MON CIEL ?"},{speaker:"L'ÉCLICOSMIQUE",text:"JE SUIS LE TONNERRE. JE SUIS LA PLUIE. AGENOUILLE-TOI… OU DEVIENS ÉCLAIR."}]},en:{elder_first:[{speaker:"ELDER VOAHANGY",text:"A stranger, washed upon our shore… The ocean spits nothing back out of kindness, child."},{speaker:"KYA",text:"I am looking for my brother. My boat broke in the storm. Where am I?"},{speaker:"ELDER VOAHANGY",text:"On the nameless island. Here, rain has fallen for a hundred years without a single pause. It is the work of the one they call the Eclicosmic."},{speaker:"ELDER VOAHANGY",text:"Take this sword. It once belonged to a guardian. If you want answers, listen to the island."},{speaker:"ELDER VOAHANGY",text:"To the north sleeps a Red Gate. Fifteen Keys seal its passage. Find them all… and perhaps you will see the sky."},{speaker:"ELDER VOAHANGY",text:"One last thing. The Slaches roam the forest. Each beast you slay feeds your healing gauge. Spilled blood will mend you."}],elder_repeat:[{speaker:"ELDER VOAHANGY",text:"Fifteen Keys, Kya. Some gleam upon the hills, others must be earned: the blood of Slaches, Mira's stones…"}],elder_fifteen:[{speaker:"ELDER VOAHANGY",text:"Fifteen Keys… So the legend has chosen its blade. Listen well, child."},{speaker:"ELDER VOAHANGY",text:"The Eclicosmic is no god. It is an impostor that crowned itself with our sky. The true deities are the Six Cosmic Entities."},{speaker:"ELDER VOAHANGY",text:"They are invincible, and they wait behind the Gate. Do not fear them. Fear the one pretending to be
